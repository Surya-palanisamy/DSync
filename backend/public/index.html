<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSync Server</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #212429;
        color: #f5f5f5;
      }
      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .content {
        text-align: center;
      }
      h1 {
        color: #76a387;
        margin-bottom: 1rem;
      }
      p {
        color: #f5f5f5;
        margin-bottom: 1rem;
      }
      .time {
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>🚀 API is running smoothly! 🌟</h1>
        <p>Welcome to DSync Server. Everything is set up and ready to go!</p>
        <p class="time">Current Time: <span id="currentTime"></span></p>
      </div>
    </div>

    <!-- LIVE CLOCK SCRIPT -->
    <script>
      function updateClock() {
        document.getElementById("currentTime").innerText =
          new Date().toLocaleTimeString();
      }

      updateClock(); // Initial call
      setInterval(updateClock, 1000); // Update every second
    </script>
  </body>
</html>
